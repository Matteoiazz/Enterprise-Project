version: '3.8'

services:
  # Database per il servizio Catalog
  db-catalog:
    image: postgres:15
    container_name: db-catalog
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: db_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per il servizio Booking
  db-booking:
    image: postgres:15
    container_name: db-booking
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per l'Auth (User)
  db-auth:
    image: postgres:15
    container_name: db-auth
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per il servizio Communication (Gianmaria) - Porta spostata a 5437 per evitare conflitti
  communication-service:
    image: postgres:15
    container_name: communication-service
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: communication-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per il servizio Itinerary
  db-itinerary:
    image: postgres:15
    container_name: db-itinerary
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: db_itinerary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database persistente per Keycloak
  db-keycloak:
    image: postgres:15
    container_name: db-keycloak
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - travel-network
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - travel-network

  # Il tuo guardiano Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    # --import-realm: importa automaticamente i file .json trovati nella cartella
    # montata su /opt/keycloak/data/import al primo avvio di un database vuoto.
    # Se il realm "tripify" esiste gia' nel DB, Keycloak lo lascia stare (non lo
    # sovrascrive) - serve soprattutto per chi clona il progetto da zero o resetta
    # il volume del DB.
    command: start-dev --import-realm
    depends_on:
      - db-keycloak
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # Collegamento al DB
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    networks:
      - travel-network
    volumes:
      - ./keycloak-themes/tripify:/opt/keycloak/themes/tripify
      - ./keycloak-import:/opt/keycloak/data/import

networks:
  travel-network:
    driver: bridge

volumes:
  keycloak-db-data:
