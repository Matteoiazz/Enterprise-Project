version: '3.8'

services:
  # Database per il servizio Catalog
  db-catalog:
    image: postgres:15
    container_name: db-catalog
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: db_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per il servizio Booking
  db-booking:
    image: postgres:15
    container_name: db-booking
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per l'Auth (User)
  db-auth:
    image: postgres:15
    container_name: db-auth
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database per il servizio Communication (Gianmaria) - Porta spostata a 5437 per evitare conflitti
    # Database per il servizio Communication (Gianmaria)
  db-communication:
    image: postgres:15
    container_name: db-communication
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: communication-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

    # Microservizio Java Communication
  communication-app:
    build:
      context: ./communication-service
      dockerfile: Dockerfile
    container_name: communication-app
    ports:
      - "8084:8084"
    depends_on:
      - db-communication
      - rabbitmq
      - keycloak
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-communication:5432/communication-service
      - SPRING_RABBITMQ_HOST=rabbitmq
      - CATALOG_SERVICE_URL=http://catalog-service:8082
    networks:
      - travel-network

  # Database per il servizio Itinerary
  db-itinerary:
    image: postgres:15
    container_name: db-itinerary
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: db_itinerary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - travel-network

  # Database persistente per Keycloak
  db-keycloak:
    image: postgres:15
    container_name: db-keycloak
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - travel-network
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  # Booking Service (carrello, checkout, pagamento simulato, prenotazioni)
  booking-service:
    build:
      context: ./booking-service
    container_name: booking-service
    depends_on:
      - db-booking
      - rabbitmq
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-booking:5432/db_booking
      DB_PASSWORD: ${DB_PASSWORD:-password}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      LOCAL_IP: ${LOCAL_IP}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # catalog-service e user-auth-service non sono (ancora) in questo
      # compose: finche' non ci sono, si raggiungono sulla macchina host che
      # li fa girare a mano. Quando anche loro avranno una voce qui, questi
      # due vanno ripuntati al nome del servizio (es. http://catalog-service:8082/...).
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8082/api/v1/catalog}
      USER_AUTH_SERVICE_URL: ${USER_AUTH_SERVICE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      # Su Docker Desktop (Windows/Mac) c'e' gia' di default; su Linux serve
      # esplicitamente per far risolvere host.docker.internal dal container.
      - "host.docker.internal:host-gateway"
    networks:
      - travel-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - travel-network

  # Il tuo guardiano Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    # --import-realm: importa automaticamente i file .json trovati nella cartella
    # montata su /opt/keycloak/data/import al primo avvio di un database vuoto.
    # Se il realm "tripify" esiste gia' nel DB, Keycloak lo lascia stare (non lo
    # sovrascrive) - serve soprattutto per chi clona il progetto da zero o resetta
    # il volume del DB.
    command: start-dev --import-realm
    depends_on:
      - db-keycloak
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # Collegamento al DB
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      # Fissa l'hostname nel token (claim "iss") a un valore stabile: l'app
      # Android e i servizi dentro Docker devono vedere lo stesso issuer,
      # altrimenti la validazione del JWT fallisce anche se Keycloak e'
      # raggiungibile da entrambi.
      KC_HOSTNAME: ${LOCAL_IP}
    networks:
      - travel-network
    volumes:
      - ./keycloak-themes/tripify:/opt/keycloak/themes/tripify
      - ./keycloak-import:/opt/keycloak/data/import

  # Catalog Service (Matteo)
  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    depends_on:
      - db-catalog
      - rabbitmq
      - keycloak
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-catalog:5432/db_catalog
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${LOCAL_IP}:8180/realms/tripify
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    networks:
      - travel-network

  # Itinerary Service (Matteo)
  itinerary-service:
    build: ./itinerary-service
    container_name: itinerary-service
    depends_on:
      - db-itinerary
      - catalog-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-itinerary:5432/db_itinerary
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${LOCAL_IP}:8180/realms/tripify
      CATALOG_SERVICE_URL: http://catalog-service:8082/api/v1/catalog
      BOOKING_SERVICE_URL: http://booking-service:8083
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  keycloak-db-data:
