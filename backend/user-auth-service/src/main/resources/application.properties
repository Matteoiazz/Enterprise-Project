# 1. Configurazione del Server
server.port=8081

# 2. Nome del Microservizio
spring.application.name=user-auth-service

# 3. Connessione al Database
spring.datasource.url=jdbc:postgresql://localhost:5434/db_auth
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. CONFIGURAZIONE OAUTH2 CON KEYCLOAK
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.1.33:8180/realms/tripify