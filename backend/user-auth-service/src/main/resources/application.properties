# 1. Configurazione del Server
server.port=8081

# 2. Nome del Microservizio
spring.application.name=user-auth-service

# 3. Connessione al Database
spring.datasource.url=jdbc:postgresql://localhost:5434/db_auth
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. CONFIGURAZIONE OAUTH2 CON KEYCLOAK
# issuer-uri = host pubblico atteso nel claim "iss" del token (in Docker lo
# sovrascrive il compose con l'URL del tunnel). jwk-set-uri esplicito: con
# entrambi valorizzati Spring NON fa il fetch del discovery a startup e prende
# le chiavi in modo lazy, quindi l'avvio non dipende da Keycloak gia' pronto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_LOCAL_URL:http://localhost:8180}/realms/tripify
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_LOCAL_URL:http://localhost:8180}/realms/tripify/protocol/openid-connect/certs

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
