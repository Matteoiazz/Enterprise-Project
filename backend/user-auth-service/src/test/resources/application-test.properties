# Profilo "test": nessuna infrastruttura reale.
# - DB in memoria H2 (in modalita' PostgreSQL) al posto del Postgres vero
# - niente data.sql
# - il JwtDecoder viene sostituito da un mock nel test, quindi non si tenta
#   nessuna connessione a Keycloak all'avvio del contesto
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never
