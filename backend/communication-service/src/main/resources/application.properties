spring.application.name=communication-service


spring.datasource.url=jdbc:postgresql://localhost:5437/communication-service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Creazione automatica delle tabelle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${LOCAL_IP:localhost}:8180/realms/tripify
server.port=8084

# Chiave di servizio per la chiamata a catalog-service (aggiornamento rating):
# stesso valore configurato lato catalog-service.
internal.service-key=${INTERNAL_SERVICE_KEY:}