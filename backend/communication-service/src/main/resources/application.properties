spring.application.name=communication-service


spring.datasource.url=jdbc:postgresql://localhost:5437/communication-service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Creazione automatica delle tabelle
spring.jpa.hibernate.ddl-auto=update
# Mostra nel terminale le query SQL (molto utile per il debug)
spring.jpa.show-sql=true

# --- SEED RECENSIONI (data.sql) ---
# 'always' esegue data.sql ad ogni avvio; lo script e' idempotente (DELETE sulla
# fascia id < 1000, le recensioni degli utenti partono da 2001). 'never' per non riseminare.
spring.sql.init.mode=always
# Aspetta che Hibernate crei le tabelle prima di lanciare data.sql.
spring.jpa.defer-datasource-initialization=true

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Fallback a localhost se LOCAL_IP non e' esportata: senza, la property resterebbe
# col placeholder letterale e OGNI token verrebbe rifiutato con 401. LOCAL_IP deve
# avere lo stesso valore in tutti i microservizi e coincidere con l'host da cui
# l'app ottiene i token da Keycloak.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${LOCAL_IP:localhost}:8180/realms/tripify
server.port=8084

# Chiave di servizio per la chiamata a catalog-service (aggiornamento rating):
# stesso valore configurato lato catalog-service.
internal.service-key=${INTERNAL_SERVICE_KEY:dev-internal-key}