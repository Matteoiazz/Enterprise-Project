# Porta del microservizio
server.port=8083

# Nome dell'applicazione
spring.application.name=booking-service

# Configurazione Database PostgreSQL (Adattala alle tue credenziali Docker/Locali)
spring.datasource.url=jdbc:postgresql://localhost:5433/db_booking
spring.datasource.username=postgres
# ${DB_PASSWORD:password} -> se esiste la variabile d'ambiente DB_PASSWORD la usa,
# altrimenti fa fallback su "password" (comodo in locale, sostituibile in produzione/demo)
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Strategia Hibernate: crea le tabelle in automatico nel DB se non esistono.
# Va bene in sviluppo; prima della consegna finale valutate di passare a "validate"
# + schema gestito a parte (script SQL o Flyway/Liquibase), per non rischiare
# modifiche distruttive automatiche sullo schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disattiva l'Open Session In View: senza questo, le relazioni FetchType.LAZY
# possono comunque essere caricate fuori dai metodi @Transactional del service
# (es. durante la serializzazione JSON), mascherando query N+1.
# Se dopo questa modifica vedi LazyInitializationException, significa che da
# qualche parte stai leggendo una relazione lazy fuori dal service: va risolto
# li (es. caricandola esplicitamente nel service), non riattivando questa opzione.
spring.jpa.open-in-view=false

# URL del Catalog Service usato da CatalogClient (Feign).
# Verifica con chi segue quel servizio che porta e path siano corretti.
catalog-service.url=http://localhost:8082/api/v1/catalog

# URL del User Auth Service usato da UserAuthClient (Feign).
user-auth-service.url=http://localhost:8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${LOCAL_IP}:8180/realms/tripify

# Connessione RabbitMQ (stessa istanza/credenziali di sviluppo usate da
# communication-service). BookingEventPublisher/sendNotification pubblicano
# davvero su questa coda (conferma pagamento, inviti, check-in aperto, ecc.).
# Nota: il consumer di communication-service si aspetta una classe evento
# diversa dalla nostra BookingNotificationEvent (stesso nome di coda, type
# header diverso) - è un disallineamento di contratto noto, da risolvere
# insieme (vedi audit, non affrontato qui).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}