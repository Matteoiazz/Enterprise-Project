spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# internal.service-key non ha più un default in produzione (allineato a
# catalog/communication): serve un valore qui, altrimenti il contesto Spring
# non parte nemmeno nei test (vedi BookingService.internalServiceKey).
internal.service-key=test-internal-key
