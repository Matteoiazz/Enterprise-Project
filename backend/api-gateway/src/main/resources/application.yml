server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/catalog/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/cart/**, /api/v1/bookings/**, /api/v1/payments/**

        - id: itinerary-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/itinerary/**

        - id: communication-service
          uri: http://localhost:8084
          predicates:
            - Path=/chat/**, /ws-chat/**, /api/notifications/**,/api/v1/reviews/**
