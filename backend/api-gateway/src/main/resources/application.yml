server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 15s
      routes:
        - id: user-auth-service
          uri: ${USER_AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/catalog/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**, /api/v1/bookings/**, /api/v1/payments/**

        - id: itinerary-service
          uri: ${ITINERARY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/itinerary/**

        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/chat/**, /ws-chat/**, /api/notifications/**,/api/v1/reviews/**
