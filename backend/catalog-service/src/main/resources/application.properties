# ==========================================
# 1. IDENTITA' DEL MICROSERVIZIO E PORTA
# ==========================================
spring.application.name=catalog-service
server.port=8082

# ==========================================
# 2. CONFIGURAZIONE DATABASE POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5435/db_catalog
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. CONFIGURAZIONE JPA E HIBERNATE
# ==========================================
# 'update' mantiene i dati esistenti e aggiunge solo le novita'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- GESTIONE DATA.SQL ---
# 'always' esegue data.sql ad ogni avvio.
# Se preferisci inserire i dati una volta sola, imposta a 'never' dopo il primo avvio riuscito.
spring.sql.init.mode=always
# Fondamentale: dice a Spring di aspettare che Hibernate crei le tabelle prima di lanciare lo script SQL.
spring.jpa.defer-datasource-initialization=true

# Un client non puo' chiedere pagine piu' grandi di questa (es. search/items/host):
# senza un tetto esplicito Spring userebbe il suo default (2000).
spring.data.web.pageable.max-page-size=100

# ==========================================
# 4. CONFIGURAZIONE RABBITMQ
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# 5. VALIDAZIONE JWT (per gli endpoint hold/confirm/release, che richiedono
# un utente reale autenticato invece del vecchio guestUserId lato client)
# ==========================================
# Se LOCAL_IP non e' esportata, si usa localhost come fallback invece di
# lasciare la property con il placeholder letterale.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${LOCAL_IP:localhost}:8180/realms/tripify