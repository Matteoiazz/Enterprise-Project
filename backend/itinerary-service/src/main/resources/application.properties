spring.application.name=itinerary-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5438/db_itinerary
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# Esegue data.sql ad ogni avvio, dopo che Hibernate ha creato le tabelle
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Per leggere categoria/città dei CatalogItem quando serve validare/pubblicare una lista
catalog-service.url=http://localhost:8082/api/v1/catalog

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tripify}
